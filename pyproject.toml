[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scalably-gsc-mcp"
version = "1.0.0"
description = "Read-only MCP server for Google Search Console: sites, Search Analytics with auto-pagination and hourly data, sitemaps, URL inspection and batch inspection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scalably", email = "hello@scalably.io" }]
keywords = ["mcp", "model-context-protocol", "google-search-console", "seo", "scalably"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = ["mcp>=1.6.0,<2", "requests>=2.32.3", "google-auth>=2.20.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gsc-mcp = "scalably_gsc_mcp.server:main"

[project.urls]
Homepage = "https://scalably.io/mcp/gsc-mcp"
Repository = "https://github.com/scalably-io/gsc-mcp"
Issues = "https://github.com/scalably-io/gsc-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scalably_gsc_mcp"]
